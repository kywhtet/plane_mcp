[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plane-mcp"
version = "0.1.0"
description = "MCP server for Plane project management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
plane-mcp = "plane_mcp.__main__:main"
